# /etc/sysctl.d/99-homelab-tuning.conf
# Disk I/O and virtual memory tuning for 32.7 MB/s storage & 4 GB RAM (Debian 13)

# Flush dirty pages earlier in smaller bursts to avoid I/O stalls
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Reduce unnecessary swapping while keeping memory pressure manageable
vm.swappiness = 10
